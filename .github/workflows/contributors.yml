name: contributors

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"      # weekly safety net
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh contributors block
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/contributors.py
      - name: Open a PR if changed
        env:
          # main takes changes through a PR — a direct push from here is
          # rejected by branch protection. CONTRIBUTORS_PAT (a fine-grained
          # token with contents+PR write) makes the PR's checks run on its
          # own; on the fallback token GitHub suppresses them, so the PR
          # needs one manual engine-ci dispatch before it can merge.
          GH_TOKEN: ${{ secrets.CONTRIBUTORS_PAT || github.token }}
        run: |
          if git diff --quiet -- README.md; then
            echo "no contributor changes"; exit 0
          fi
          BRANCH=chore/contributors      # one standing branch, kept current
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "docs(readme): refresh contributors"
          git push -f -u origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs(readme): refresh contributors" \
              --body "The contributor list changed. Block regenerated by \`.github/scripts/contributors.py\` between the README markers — no hand edits."
          else
            echo "PR already open for $BRANCH — updated in place"
          fi
